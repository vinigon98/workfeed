<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Leads | Workfeed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F6F8FA;
    }
  </style>
</head>
<body class="min-h-screen text-slate-700 selection:bg-slate-900/10">

  <!-- Header -->
  <header class="bg-slate-900 text-white py-4 px-8 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-4">
      <span class="flex items-center" style="background: white; padding: 4px 8px; border-radius: 6px;">
    <img src="/workfeed_logo.png" alt="Workfeed" style="height: 24px; width: auto; display: block; object-fit: contain;" />
  </span>
      <span class="text-xs bg-white/10 text-slate-300 px-3 py-1 rounded border border-white/5 font-mono">Leads Administrativos (Ambiente Seguro)</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="/landing" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded transition-all">
        Voltar para Home
      </a>
      <button onclick="fetchLeads()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded transition-all font-semibold shadow-sm">
        Atualizar Lista
      </button>
    </div>
  </header>

  <main class="container mx-auto px-6 py-10 max-w-7xl">
    
    <!-- Dashboard Stats & Search -->
    <div class="grid md:grid-cols-12 gap-6 mb-8 items-center">
      
      <!-- Metrics Card -->
      <div class="md:col-span-4 bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Total de Leads</p>
          <h2 id="leads-counter" class="text-3xl font-extrabold text-slate-900 mt-1">--</h2>
        </div>
        <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-slate-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
        </div>
      </div>

      <!-- Search Input -->
      <div class="md:col-span-8 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Filtrar Solicitações</label>
        <div class="relative">
          <input type="text" id="search-input" oninput="filterLeads(this.value)" placeholder="Buscar por Nome, Empresa, E-mail ou WhatsApp..." class="w-full bg-slate-50 border border-slate-200 rounded px-4 py-3 text-sm focus:outline-none focus:border-slate-800 text-slate-800 transition-all">
          <span class="absolute right-3 top-3.5 text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </span>
        </div>
      </div>

    </div>

    <!-- Table Card -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-900 text-white text-[10px] uppercase font-bold tracking-wider">
              <th class="py-4 px-6 border-b border-slate-200">Data/Hora</th>
              <th class="py-4 px-6 border-b border-slate-200">Nome / Cargo</th>
              <th class="py-4 px-6 border-b border-slate-200">Empresa / Tamanho</th>
              <th class="py-4 px-6 border-b border-slate-200">E-mail Corporativo</th>
              <th class="py-4 px-6 border-b border-slate-200">WhatsApp</th>
              <th class="py-4 px-6 border-b border-slate-200 font-medium">Interesse Principal</th>
              <th class="py-4 px-6 border-b border-slate-200 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="leads-table-body" class="divide-y divide-slate-100 text-xs">
            <tr>
              <td colspan="7" class="py-10 text-center text-slate-400 font-light">Carregando solicitações corporativas...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    let allLeads = [];

    async function fetchLeads() {
      const tbody = document.getElementById('leads-table-body');
      try {
        // Consome o endpoint secreto e ofuscado
        const response = await fetch('/api/leads-secure-7v2a9x');
        const data = await response.json();
        
        allLeads = data.leads || [];
        
        document.getElementById('leads-counter').innerText = allLeads.length;
        renderTable(allLeads);
      } catch (err) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-10 text-center text-red-500 font-semibold bg-red-50/20">
              [WARNING] Erro de rede ou servidor offline ao obter solicitações da API segura.
            </td>
          </tr>
        `;
        console.error('Erro ao buscar leads:', err);
      }
    }

    function renderTable(leads) {
      const tbody = document.getElementById('leads-table-body');
      if (leads.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-10 text-center text-slate-400 font-light bg-slate-50/10">
              Nenhuma solicitação comercial cadastrada até o momento.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = leads.map(lead => {
        const rawDate = new Date(lead.created_at);
        const formattedDate = rawDate.toLocaleDateString('pt-BR') + ' ' + rawDate.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        const cleanPhone = (lead.whatsapp || '').replace(/\D/g, '');
        const waLink = cleanPhone ? `https://wa.me/55${cleanPhone}` : '#';

        return `
          <tr class="hover:bg-slate-50/50 transition-all lead-row">
            <td class="py-4 px-6 border-b border-slate-100 text-slate-500 whitespace-nowrap font-mono text-[10px]">${formattedDate}</td>
            <td class="py-4 px-6 border-b border-slate-100">
              <div class="font-bold text-slate-800 uppercase tracking-tight">${lead.nome}</div>
              <div class="text-[10px] text-slate-400 mt-0.5">${lead.cargo || 'Não especificado'}</div>
            </td>
            <td class="py-4 px-6 border-b border-slate-100">
              <div class="font-semibold text-slate-800 uppercase tracking-tight">${lead.empresa}</div>
              <div class="text-[10px] text-slate-400 mt-0.5">${lead.tamanho_empresa || 'Não especificado'} colabs</div>
            </td>
            <td class="py-4 px-6 border-b border-slate-100 font-mono whitespace-nowrap">
              <span class="text-slate-600 mr-2">${lead.email}</span>
              <button onclick="copyToClipboard('${lead.email}', this)" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded text-[9px] transition-all font-sans">
                Copiar
              </button>
            </td>
            <td class="py-4 px-6 border-b border-slate-100 font-mono whitespace-nowrap">
              <span class="text-slate-600 mr-2">${lead.whatsapp}</span>
              <button onclick="copyToClipboard('${lead.whatsapp}', this)" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded text-[9px] transition-all font-sans mr-1">
                Copiar
              </button>
              ${cleanPhone ? `
                <a href="${waLink}" target="_blank" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 px-1.5 py-0.5 rounded text-[9px] transition-all font-sans font-semibold">
                  WhatsApp
                </a>
              ` : ''}
            </td>
            <td class="py-4 px-6 border-b border-slate-100">
              <span class="px-2.5 py-1 text-[10px] font-semibold text-slate-700 bg-slate-100 rounded border border-slate-200 leading-none inline-block">
                ${lead.maior_desafio || 'Geral'}
              </span>
            </td>
            <td class="py-4 px-6 border-b border-slate-100 text-right whitespace-nowrap">
              <span class="text-[9px] uppercase tracking-widest font-mono font-bold text-slate-400 px-2 py-1 rounded bg-slate-100 border border-slate-200">
                Ativo
              </span>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterLeads(val) {
      const query = val.toLowerCase().trim();
      if (!query) {
        renderTable(allLeads);
        return;
      }
      const filtered = allLeads.filter(lead => {
        return (lead.nome || '').toLowerCase().includes(query) ||
               (lead.empresa || '').toLowerCase().includes(query) ||
               (lead.email || '').toLowerCase().includes(query) ||
               (lead.whatsapp || '').toLowerCase().includes(query) ||
               (lead.cargo || '').toLowerCase().includes(query) ||
               (lead.maior_desafio || '').toLowerCase().includes(query);
      });
      renderTable(filtered);
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerText;
        btn.innerText = 'Copiado!';
        btn.classList.add('bg-emerald-600', 'text-white');
        btn.classList.remove('bg-slate-100', 'text-slate-600');
        setTimeout(() => {
          btn.innerText = originalText;
          btn.classList.remove('bg-emerald-600', 'text-white');
          btn.classList.add('bg-slate-100', 'text-slate-600');
        }, 1500);
      }).catch(err => {
        console.error('Erro ao copiar:', err);
      });
    }

    // Carga inicial
    document.addEventListener('DOMContentLoaded', fetchLeads);
  </script>
</body>
</html>
